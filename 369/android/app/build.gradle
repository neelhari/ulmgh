apply plugin: 'com.android.application'

android {
    namespace = "com.ulmgh.store"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.ulmgh.store"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.0.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (project.hasProperty('ULMGH_RELEASE_STORE_FILE') &&
                project.hasProperty('ULMGH_RELEASE_STORE_PASSWORD') &&
                project.hasProperty('ULMGH_RELEASE_KEY_ALIAS') &&
                project.hasProperty('ULMGH_RELEASE_KEY_PASSWORD') &&
                !project.property('ULMGH_RELEASE_STORE_FILE').toString().trim().isEmpty() &&
                !project.property('ULMGH_RELEASE_STORE_PASSWORD').toString().trim().isEmpty() &&
                !project.property('ULMGH_RELEASE_KEY_ALIAS').toString().trim().isEmpty() &&
                !project.property('ULMGH_RELEASE_KEY_PASSWORD').toString().trim().isEmpty()) {

                storeFile file(project.property('ULMGH_RELEASE_STORE_FILE'))
                storeType 'PKCS12'
                storePassword project.property('ULMGH_RELEASE_STORE_PASSWORD')
                keyAlias project.property('ULMGH_RELEASE_KEY_ALIAS')
                keyPassword project.property('ULMGH_RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def hasReleaseBuildTask = taskGraph.allTasks.any { task ->
        task.name.toLowerCase().contains("release") &&
        (task.name.startsWith("assemble") || task.name.startsWith("bundle") || task.name.startsWith("package"))
    }
    if (hasReleaseBuildTask) {
        def missing = []
        if (!project.hasProperty('ULMGH_RELEASE_STORE_FILE') || project.property('ULMGH_RELEASE_STORE_FILE').toString().trim().isEmpty()) missing.add("ULMGH_RELEASE_STORE_FILE")
        if (!project.hasProperty('ULMGH_RELEASE_STORE_PASSWORD') || project.property('ULMGH_RELEASE_STORE_PASSWORD').toString().trim().isEmpty()) missing.add("ULMGH_RELEASE_STORE_PASSWORD")
        if (!project.hasProperty('ULMGH_RELEASE_KEY_ALIAS') || project.property('ULMGH_RELEASE_KEY_ALIAS').toString().trim().isEmpty()) missing.add("ULMGH_RELEASE_KEY_ALIAS")
        if (!project.hasProperty('ULMGH_RELEASE_KEY_PASSWORD') || project.property('ULMGH_RELEASE_KEY_PASSWORD').toString().trim().isEmpty()) missing.add("ULMGH_RELEASE_KEY_PASSWORD")

        if (!missing.isEmpty()) {
            throw new GradleException("ULMGH Release Signing Error: Missing required release signing property/properties in ~/.gradle/gradle.properties: ${missing.join(', ')}. Release builds cannot proceed unsigned.")
        }
        def kFile = file(project.property('ULMGH_RELEASE_STORE_FILE'))
        if (!kFile.exists()) {
            throw new GradleException("ULMGH Release Signing Error: Keystore file does not exist at '${kFile.absolutePath}'.")
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Firebase BoM and Firebase Cloud Messaging (FCM)
    implementation platform('com.google.firebase:firebase-bom:33.10.0')
    implementation 'com.google.firebase:firebase-messaging'

    // Official Razorpay Android Standard SDK
    implementation 'com.razorpay:checkout:1.6.40'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
